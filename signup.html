<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trapo | Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>

    <header>
        <h1>Create Your Trapo Account</h1>
        <p>Join us for a better shopping experience</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart</a>
        <a href="signup.html">Sign Up</a>
    </nav>

    <section class="signup-container">
        <h2>Sign Up</h2>

        <form action="#" method="post" class="signup-form">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="Enter your phone number" required>

            <label for="password">Create Password</label>
            <input type="password" id="password" placeholder="Create a password" required>

            <label for="cpassword">Confirm Password</label>
            <input type="password" id="cpassword" placeholder="Confirm your password" required>

            <button type="submit">Create Account</button>

            <p class="login-link">
                Already have an account? <a href="#">Login here</a>
            </p>

        </form>
    </section>

    <footer>
        <p>&copy; 2025 Trapo | All Rights Reserved</p>
    </footer>

</body>
</html>
